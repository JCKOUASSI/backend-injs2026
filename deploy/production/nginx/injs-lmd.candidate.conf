# =============================================================================
# INJS-LMD — configuration nginx CANDIDATE (mission 02, blocage B6/§8)
#
# À NE PAS appliquer directement sur le VPS : voir
# docs/deploiement/mission-02/DEPLOY_INJS_MISSION_02_NGINX.md (§ procédure).
#
# Place dans la chaîne :  Internet → HTTPS → Nginx Proxy Manager (TLS)
#                              → ce gateway (HTTP, réseau Docker) → frontend / backend
#
# Ce que cette candidate corrige par rapport à docker/nginx/default.conf :
#
#   1. X-Forwarded-Proto : le protocole réel (https) transmis par NPM n'est plus
#      écrasé par $scheme (qui vaut « http » ici, puisque NPM termine le TLS).
#      Sans cela : SECURE_PROXY_SSL_HEADER côté Django ne voit jamais « https »
#      → cookies Secure/CSRF incohérents, redirections incorrectes.
#   2. /admin/ : accès restreint (liste d'IP) au lieu d'une exposition publique.
#   3. client_max_body_size : valeur dimensionnée sur les limites métier réelles
#      du code (pièces de candidature 10 Mio, preuves de paiement 5 Mio).
#   4. En-têtes de sécurité absents auparavant (nosniff, referrer, frame).
#   5. Journaux et délais de proxy explicites (uploads et imports Excel longs).
# =============================================================================

# --- Protocole réel, sans écrasement ----------------------------------------
# Si le proxy amont fournit X-Forwarded-Proto, on le CONSERVE ; sinon on retombe
# sur $scheme (cas d'un accès direct, par exemple une sonde interne).
map $http_x_forwarded_proto $injs_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# --- Connexions : valeur unique et documentée --------------------------------
upstream injs_backend {
    server backend:8000;
    keepalive 32;
}

upstream injs_frontend {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # --- Taille des requêtes (B6/C) -----------------------------------------
    # Justification mesurée sur le code, pas arbitraire :
    #   * backend/core/validators.py : TAILLE_MAX_PIECE   = 10 Mio (pièces de
    #     candidature : PDF/JPG de diplôme, acte de naissance, relevés) ;
    #   * backend/core/validators.py : TAILLE_MAX_PREUVE  = 5 Mio (preuves de
    #     paiement) ;
    #   * imports Excel (openpyxl, formations/api_views.py) : quelques Mo.
    # 12 Mio = 10 Mio (limite métier la plus haute) + enveloppe multipart.
    # Choisir 10 Mio exactement ferait échouer en 413 certaines pièces que
    # Django accepte ; choisir 100 Mio exposerait le serveur sans raison.
    # Ainsi, c'est DJANGO qui refuse proprement un fichier trop gros (message
    # explicite) et non nginx (erreur 413 opaque).
    client_max_body_size 12m;

    client_body_timeout 60s;
    client_header_timeout 20s;
    keepalive_timeout 65s;

    # --- En-têtes de sécurité (B6/D) ----------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    # --- Journaux ------------------------------------------------------------
    access_log /var/log/nginx/injs-access.log;
    error_log  /var/log/nginx/injs-error.log warn;

    # --- API Django ----------------------------------------------------------
    # Chemin public : jamais restreint, c'est ce qui fait fonctionner le front
    # (y compris le scan QR depuis les téléphones en mobilité).
    location /api/ {
        proxy_pass http://injs_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        # Conservation du protocole réel (correction B6/A).
        proxy_set_header X-Forwarded-Proto $injs_forwarded_proto;

        # Imports Excel / générations PDF : le traitement peut dépasser 60 s.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }

    # --- Administration Django (B6/B) ---------------------------------------
    # L'admin n'est PAS une interface publique : inscription administrative,
    # décisions de jury et données personnelles y sont modifiables.
    # Politique : liste d'IP autorisées, refus explicite par défaut.
    # La liste est fournie par le fichier inclus ci-dessous, généré lors de
    # l'application (voir la procédure documentaire) — jamais commité avec des
    # adresses réelles.
    location /admin/ {
        include /etc/nginx/conf.d/injs-admin-allowlist.conf;

        proxy_pass http://injs_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Proto $injs_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- Statiques et médias servis par Django ------------------------------
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        # Les pièces de candidature ne doivent jamais être mises en cache par
        # un intermédiaire partagé : données personnelles.
        location ~ ^/media/candidatures/ {
            alias /app/media/candidatures/;
            add_header Cache-Control "private, no-store" always;
        }
    }

    # --- Frontend React (SPA) ------------------------------------------------
    location / {
        proxy_pass http://injs_frontend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $injs_forwarded_proto;
    }

    # --- Sonde de santé (utile aux contrôles de bascule) ---------------------
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
