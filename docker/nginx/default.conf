# Passerelle INJS-LMD — configuration durcie (mission 02, 6 novembre 2026)
#
# Rôle : unique point d'entrée HTTP de la stack. Le TLS est terminé par Nginx
# Proxy Manager (NPM), qui transmet ici la requête en HTTP avec les en-têtes
# X-Forwarded-* ; la présente configuration doit les relayer fidèlement à Django.
#
# Corrections apportées (points A, B et C de la mission 02) :
#   A. X-Forwarded-Proto n'est plus écrasé par $scheme : le protocole public
#      annoncé par NPM est conservé (sinon Django croit la requête en HTTP,
#      alors que le navigateur est en HTTPS -> incohérence cookies/CSRF).
#   B. /admin/ est fermé par défaut (deny all) : procédure d'ouverture
#      commentée ci-dessous.
#   C. client_max_body_size est explicitement défini, valeur justifiée par les
#      limites applicatives réelles (voir commentaire détaillé).

# ── A. Protocole public ─────────────────────────────────────────────────────
# Si NPM transmet X-Forwarded-Proto, on le conserve ; sinon on retombe sur le
# protocole de la connexion entrante. `$scheme` seul était une erreur : dans ce
# conteneur la connexion NPM -> passerelle est toujours en HTTP.
map $http_x_forwarded_proto $proto_public {
    default  $http_x_forwarded_proto;
    ''       $scheme;
}

# ── C. Taille maximale des requêtes ─────────────────────────────────────────
# Justification (aucune valeur arbitraire) :
#   backend/core/validators.py : TAILLE_MAX_PIECE  = 10 Mio (pièce de dossier)
#                                TAILLE_MAX_PREUVE =  5 Mio (preuve de paiement)
#   Une requête de candidature peut porter une pièce ET une preuve dans le même
#   envoi multipart : 10 + 5 = 15 Mio de fichiers, auxquels s'ajoutent l'encodage
#   multipart, les en-têtes et les champs texte (~10 % de marge) → 17 Mio.
#   Valeur retenue : 25 Mio, soit une marge confortable sans exposer le serveur
#   à des envois massifs. Django applique ensuite ses propres limites métier.
#   Si une limite applicative venait à augmenter, réévaluer cette valeur.
client_max_body_size 25m;

server {
    listen 80;
    server_name _;

    # En-têtes communs à tous les proxys (relais fidèle du protocole public)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_public;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Frontend React (service `frontend`, port 80 interne)
    location / {
        proxy_pass http://frontend:80;
    }

    # Backend Django — API (service `backend`, port 8000 interne)
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # ── B. Administration Django ────────────────────────────────────────────
    # Fermée par défaut : l'administration ne doit pas être joignable depuis
    # l'Internet. Pour l'ouvrir, décommenter et adapter une ou plusieurs lignes
    # `allow` (IP publique du bureau, bastion ou plage VPN), puis recharger :
    #     docker compose -f deploy/production/compose.yml exec gateway \
    #         nginx -s reload
    # Ne jamais laisser `allow all;` en production.
    location /admin/ {
        # allow 41.0.0.0/16;   # << IP/plage à renseigner par l'exploitant
        # allow 10.8.0.0/24;   # exemple : plage VPN
        deny all;

        proxy_pass http://backend:8000;
    }

    # Fichiers statiques Django (volume partagé avec le service backend)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers média Django (volume persistant)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Santé de la passerelle (sonde locale, non exposée publiquement par NPM)
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
