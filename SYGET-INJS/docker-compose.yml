name: epdtcpfae

services:
  db:
    image: postgres:15
    container_name: postgres-epdtcpfae
    restart: unless-stopped
    environment:
      POSTGRES_DB: emploi_du_temps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Éviter le conflit avec d'autres stacks (ex. 5436 déjà pris sur la machine).
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emploi_du_temps"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - epdtcpfae-network

  app:
    image: ${APP_IMAGE:-epdtcpfae:local}
    container_name: epdtcpfae-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - epdtcpfae-network

  cron:
    image: ${APP_IMAGE:-epdtcpfae:local}
    container_name: epdtcpfae-cron
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c "while true; do
        python manage.py clearsessions;
        sleep 600;
      done"
    networks:
      - epdtcpfae-network

volumes:
  postgres_data:
    driver: local

networks:
  epdtcpfae-network:
    driver: bridge
