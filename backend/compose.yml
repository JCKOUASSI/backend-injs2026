services:
  db:
    image: postgres:15
    container_name: postgres-qr-badge
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: qr-badge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    image: qr-badge-app:local
    container_name: qr-badge-app
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:8001,http://127.0.0.1:8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  cron:
    image: qr-badge-app:local
    container_name: qr-badge-cron
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: >
      sh -c "while true; do
        python manage.py process_mobile_heartbeats;
        python manage.py auto_close_pointages --skip-heartbeat;
        python manage.py auto_sessions;
        sleep 300;
      done"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
