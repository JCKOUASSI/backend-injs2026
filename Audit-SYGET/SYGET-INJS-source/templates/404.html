{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — SYGET-INJS</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f8fafc; min-height: 100vh; display: flex; align-items: center; }
    .error-code { font-size: 8rem; font-weight: 900; color: #1d4ed8; line-height: 1; opacity: .12; }
    .card-404 { border: none; border-radius: 1.5rem; box-shadow: 0 8px 40px rgba(0,0,0,.08); }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card card-404 text-center p-5">
          <div class="position-relative mb-2">
            <div class="error-code">404</div>
            <div class="position-absolute top-50 start-50 translate-middle">
              <i class="bi bi-map-fill" style="font-size:3.5rem;color:#1d4ed8;"></i>
            </div>
          </div>
          <h2 class="fw-bold mt-3 mb-2" style="color:#0f172a;">Page introuvable</h2>
          <p class="text-muted mb-4">
            La page que vous cherchez n'existe pas ou a été déplacée.
          </p>
          <div class="d-flex justify-content-center gap-3">
            <a href="/" class="btn btn-primary rounded-pill px-4 fw-semibold">
              <i class="bi bi-house me-2"></i>Accueil
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill px-4">
              ← Retour
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
