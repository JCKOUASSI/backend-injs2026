name: CI

# Intégration continue bloquante — MISSION 02 / blocage B4.
#
# Historique : le dépôt n'avait aucun workflow, ce qui a laissé passer une
# dérive de modèle (migration `formations/0098` manquante) et des
# avertissements de schéma OpenAPI. Les garde-fous ci-dessous auraient échoué
# avant correction.
#
# Alignement Python 3.12 (mission 02, §9) : la CI utilise la MÊME version que
# l'image de production (`backend/Dockerfile` → `python:3.12-slim`). Une CI en
# 3.11 validait un environnement qui n'était pas celui déployé.
#
# Le job backend tourne sur PostgreSQL (et non SQLite) : c'est le moteur de
# production, et c'est la seule façon de vérifier les comportements qui en
# dépendent (verrous, contraintes, index).
#
# Ce workflow ne publie AUCUNE image : voir publish-injs-lmd.yml, qui exige en
# plus la variable de dépôt INJS_PUBLISH_ENABLED.

on:
  push:
    branches:
      - main
      - 'deploy-injs-2026/**'
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # B2 — la politique de préparation de base est testée sans Django ni Docker.
  # Job volontairement séparé et rapide : il doit échouer AVANT tout le reste
  # si le démarrage du conteneur redevenait capable de migrer implicitement.
  # ---------------------------------------------------------------------------
  politique-base:
    name: Démarrage conteneur (SKIP_DB_SETUP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la syntaxe des scripts
        run: |
          sh -n backend/entrypoint.sh
          sh -n backend/scripts/db_setup_policy.sh
          sh -n backend/scripts/migrate_explicit.sh

      - name: Tests de la politique de préparation de base
        run: sh backend/docker_tests/db_setup_policy_test.sh

      - name: La valeur par défaut de l'image ne migre pas
        run: |
          grep -q '^ENV SKIP_DB_SETUP=true' backend/Dockerfile \
            || { echo "::error::Dockerfile : ENV SKIP_DB_SETUP=true absent"; exit 1; }

  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Django + PostgreSQL, Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qr_badge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qr_badge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DEBUG: '0'
      DJANGO_SECRET_KEY: 'ci-only-0000000000000000000000000000000000000000'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1'
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: qr_badge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Version de Python
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Cohérence des dépendances installées
        run: python -m pip check

      - name: Vérifier la configuration Django
        run: python manage.py check

      # `--fail-level ERROR` : les avertissements de sécurité sont PUBLIÉS et
      # documentés (voir docs/deploiement/mission-02/DEPLOY_INJS_MISSION_02_CI_CD.md),
      # seules les erreurs bloquent. Ils ne sont jamais tus : la sortie complète
      # est conservée dans l'artefact du job.
      - name: Contrôle de sécurité du déploiement
        run: python manage.py check --deploy --fail-level ERROR

      - name: Aucune migration manquante
        run: python manage.py makemigrations --check --dry-run

      - name: Hygiène du dépôt
        run: python manage.py check_repo_hygiene

      - name: Fichiers statiques (manifeste requis par les tests)
        run: python manage.py collectstatic --noinput

      # `set -o pipefail` est OBLIGATOIRE ici : sans lui, le code retour du
      # tube est celui de `tee` (toujours 0) et un échec de Django serait
      # silencieusement transformé en succès. Les runners GitHub utilisent déjà
      # `bash -eo pipefail` par défaut, mais la garantie est rendue explicite :
      # elle ne dépend plus d'un réglage implicite du runner.
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python manage.py test --verbosity 1 2>&1 | tee /tmp/backend-tests.log

      # Les journaux d'exécution ne sont pas toujours accessibles depuis un
      # environnement restreint : on republie l'essentiel des échecs sous forme
      # d'annotations, lisibles via l'API des check-runs.
      - name: Détail des échecs
        if: failure()
        run: |
          python - <<'PY'
          import re

          try:
              lignes = open('/tmp/backend-tests.log', encoding='utf-8',
                            errors='replace').read().splitlines()
          except OSError:
              print('::error::Journal de tests introuvable')
              raise SystemExit(0)

          blocs, courant = [], None
          for ligne in lignes:
              if re.match(r'^(FAIL|ERROR): ', ligne):
                  courant = [ligne]
                  blocs.append(courant)
              elif courant is not None:
                  if ligne.startswith('=') or re.match(r'^(Ran |OK|FAILED)', ligne):
                      courant = None
                  else:
                      courant.append(ligne)

          for bloc in blocs[:15]:
              for ligne in bloc[:25]:
                  print(f'::error::{ligne[:900]}')
          print(f'::error::{len(blocs)} test(s) en échec sur PostgreSQL')
          PY

      # Conserve le journal complet : un échec isolé sur PostgreSQL doit rester
      # diagnosticable (les journaux Actions ne sont pas toujours accessibles).
      - name: Journal des tests (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-log
          path: /tmp/backend-tests.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances (reproductible)
        run: npm ci

      - name: Analyse statique (ESLint)
        run: npx eslint src --ext js,jsx --max-warnings 0

      - name: Tests (Vitest)
        run: npx vitest run

      - name: Build de production
        run: npm run build

  # ---------------------------------------------------------------------------
  docker:
    name: Configuration Docker (validation, sans publication)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Les .dockerignore sont présents
        run: |
          test -s backend/.dockerignore  || { echo "::error::backend/.dockerignore absent"; exit 1; }
          test -s frontend/.dockerignore || { echo "::error::frontend/.dockerignore absent"; exit 1; }

      - name: Les secrets sont exclus des contextes de build
        run: |
          for motif in '.venv' 'db.sqlite3' '.env' 'node_modules' 'dist'; do
            grep -qxF "$motif" backend/.dockerignore || grep -qxF "$motif" frontend/.dockerignore \
              || { echo "::error::motif '$motif' absent des .dockerignore"; exit 1; }
          done

      - uses: docker/setup-buildx-action@v3

      - name: Compose de production analysable
        run: |
          cp deploy/production/.env.example /tmp/injs.env
          sed -i 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-only-0000000000000000000000000000000000000000/' /tmp/injs.env
          docker compose -f deploy/production/compose.yml --env-file /tmp/injs.env config >/dev/null
          echo "compose de production : syntaxe et variables validées"

      - name: Image backend construite (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha,scope=injs-be-ci
          cache-to: type=gha,mode=max,scope=injs-be-ci

      - name: Image frontend construite (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          build-args: |
            VITE_API_URL=https://injs.badge-qr-code.pro/api
            VERSION=ci
          cache-from: type=gha,scope=injs-fe-ci
          cache-to: type=gha,mode=max,scope=injs-fe-ci
