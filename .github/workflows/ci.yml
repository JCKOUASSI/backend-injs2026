name: CI

# Intégration continue de la branche de livraison.
#
# Alignement des environnements (mission 02) :
#   * Python 3.12 = version de l'image de production `python:3.12-slim`.
#     Toute divergence serait un angle mort : les tests valideraient une
#     version qui n'est jamais déployée.
#   * PostgreSQL 16 en service, comme en production (jamais SQLite).
#
# Avertissements CONNUS et JUSTIFIÉS, non bloquants :
#   * `drf_spectacular.W001/W002` (~1 100 occurrences) : infos de type non
#     résolues et serializers non inférables lors de la génération du schéma
#     OpenAPI. Aucun impact à l'exécution ; le schéma reste publié avec ces
#     approximations documentées. `check --deploy` ne renvoie donc aucune
#     erreur, seulement des avertissements.
#   * `security.W008` (SECURE_SSL_REDIRECT non activé) : choix VOLONTAIRE.
#     Le TLS est terminé par Nginx Proxy Manager, qui transmet
#     `X-Forwarded-Proto` ; `SECURE_PROXY_SSL_HEADER` est configuré en
#     conséquence et les cookies sont sécurisés. Activer la redirection
#     provoquerait une boucle derrière le proxy.
#
# Intégration continue minimale mais bloquante.
#
# Créée à la suite de l'audit backend : le dépôt n'avait aucun workflow, ce qui
# a laissé passer une dérive de modèle (migration `formations/0098` manquante)
# et des avertissements de schéma OpenAPI. Les trois garde-fous ci-dessous
# auraient échoué avant correction :
#   * `makemigrations --check`  → dérive de schéma ;
#   * `manage.py check`         → configuration invalide ;
#   * suites de tests           → régressions fonctionnelles.
#
# Le job backend tourne sur PostgreSQL (et non SQLite) : c'est le moteur de
# production, et c'est la seule façon de vérifier les comportements qui en
# dépendent (verrous, contraintes, index).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qr_badge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qr_badge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DEBUG: '0'
      DJANGO_SECRET_KEY: 'ci-only-0000000000000000000000000000000000000000'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1'
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: qr_badge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la configuration Django
        run: python manage.py check

      - name: Intégrité des dépendances
        run: pip check

      - name: Contrôle de déploiement (avertissements connus tolérés)
        env:
          DJANGO_ALLOWED_HOSTS: 'injs.badge-qr-code.pro'
          CSRF_TRUSTED_ORIGINS: 'https://injs.badge-qr-code.pro'
        run: python manage.py check --deploy

      - name: Aucune migration manquante
        run: python manage.py makemigrations --check --dry-run

      - name: Hygiène du dépôt
        run: python manage.py check_repo_hygiene

      - name: Fichiers statiques (manifeste requis par les tests)
        run: python manage.py collectstatic --noinput

      - name: Tests
        run: python manage.py test --verbosity 1 2>&1 | tee /tmp/backend-tests.log

      # Les journaux d'exécution ne sont pas toujours accessibles depuis un
      # environnement restreint : on republie l'essentiel des échecs sous forme
      # d'annotations, lisibles via l'API des check-runs.
      - name: Détail des échecs
        if: failure()
        run: |
          python - <<'PY'
          import re

          try:
              lignes = open('/tmp/backend-tests.log', encoding='utf-8',
                            errors='replace').read().splitlines()
          except OSError:
              print('::error::Journal de tests introuvable')
              raise SystemExit(0)

          blocs, courant = [], None
          for ligne in lignes:
              if re.match(r'^(FAIL|ERROR): ', ligne):
                  courant = [ligne]
                  blocs.append(courant)
              elif courant is not None:
                  if ligne.startswith('=') or re.match(r'^(Ran |OK|FAILED)', ligne):
                      courant = None
                  else:
                      courant.append(ligne)

          for bloc in blocs[:15]:
              for ligne in bloc[:25]:
                  print(f'::error::{ligne[:900]}')
          print(f'::error::{len(blocs)} test(s) en échec sur PostgreSQL')
          PY

      # Conserve le journal complet : un échec isolé sur PostgreSQL doit rester
      # diagnosticable (les journaux Actions ne sont pas toujours accessibles).
      - name: Journal des tests (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-log
          path: /tmp/backend-tests.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Analyse statique
        run: npm run lint

      - name: Tests
        run: npx vitest run

      - name: Construction de production
        run: npm run build
